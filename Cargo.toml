[package]
name = "butler"
version = "0.1.0"
edition = "2024"

[dependencies]
butler-macros = { version = "0.1.0", path = "butler-macros" }
config = { version = "0.15.26", default-features = false, features = ["toml"] }
inventory = "0.3.24"
redis = { version = "1.7.1", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"], optional = true }

[workspace]
members = ["butler-macros", "demo"]

[features]
default = ["tokio", "redis"]
# Adds `Worker::run_async` and makes enqueueing from inside a tokio runtime non-blocking.
tokio = ["dep:tokio"]
# Adds the Redis backend (`backend = "redis"` in config.toml).
redis = ["dep:redis"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
