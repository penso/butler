[workspace]
members  = ["butler-macros", "demo"]
resolver = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.96"
version      = "0.1.0"

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow             = "1.0.104"
butler             = { path = "." }
butler-macros      = { path = "butler-macros", version = "0.1.0" }
config             = { default-features = false, features = ["toml"], version = "0.15.26" }
inventory          = "0.3.24"
proc-macro2        = "1.0.107"
quote              = "1.0.47"
redis              = { default-features = false, version = "1.7.1" }
serde              = { features = ["derive"], version = "1.0.229" }
serde_json         = "1.0.151"
syn                = { features = ["full"], version = "2" }
thiserror          = "2.0.19"
tokio              = { default-features = false, version = "1.53.1" }
tracing            = "0.1"
tracing-subscriber = { default-features = false, features = ["ansi", "fmt", "std"], version = "0.3" }

[package]
edition.workspace      = true
name                   = "butler"
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
default = ["redis", "tokio"]
# Adds the Redis backend (`backend = "redis"` in config.toml).
redis = ["dep:redis"]
# Adds `Worker::run_async` and makes enqueueing from inside a tokio runtime non-blocking.
tokio = ["dep:tokio"]

[dependencies]
anyhow.workspace        = true
butler-macros.workspace = true
config.workspace        = true
inventory.workspace     = true
redis                   = { optional = true, workspace = true }
serde.workspace         = true
serde_json.workspace    = true
thiserror.workspace     = true
tokio                   = { features = ["macros", "rt", "sync", "time"], optional = true, workspace = true }
tracing.workspace       = true

[dev-dependencies]
tokio = { features = ["macros", "rt-multi-thread", "sync", "time"], workspace = true }
