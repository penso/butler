name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audits the workflows themselves for injection, over-broad permissions,
  # unpinned actions, and credential persistence.
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  checks:
    name: Format, lint, and test (${{ matrix.runner }})
    needs: zizmor
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # macOS runners have no Docker; there the Redis test skips itself.
      - name: Start Redis for the Redis backend test
        if: runner.os == 'Linux'
        run: docker run -d --name butler-redis -p 6379:6379 redis:8-alpine
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint every feature combination
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features --features tokio -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features --features redis -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features --features sqlite -- -D warnings
      - name: Test default features
        run: cargo test --locked --workspace
      - name: Test without optional features
        run: cargo test --locked -p butler-jobs --no-default-features

  toml:
    name: TOML formatting
    needs: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned taplo
        env:
          TAPLO_SHA256: 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/taplo.gz" https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          echo "$TAPLO_SHA256  $RUNNER_TEMP/taplo.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/taplo.gz"
          chmod +x "$RUNNER_TEMP/taplo"
      - name: Check TOML formatting
        run: '"$RUNNER_TEMP/taplo" fmt --check'

  # The dashboard's stylesheet is committed so the crate publishes as is;
  # rebuild it with the pinned Tailwind CLI and fail if it is stale.
  web-css:
    name: Dashboard CSS is up to date
    needs: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Tailwind CSS CLI
        env:
          TAILWIND_SHA256: 39e8d4e24b3c83b0a6e69e100a972fbc75d5fef8dce47b3ddac3cf92dea81fe3
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v4.2.1/tailwindcss-linux-x64
          echo "$TAILWIND_SHA256  $RUNNER_TEMP/tailwindcss" | sha256sum --check
          chmod +x "$RUNNER_TEMP/tailwindcss"
      - name: Rebuild assets/app.css and compare
        working-directory: crates/butler-web
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tailwindcss" -i ui/input.css -o assets/app.css --minify
          if ! git diff --exit-code --stat -- assets/app.css; then
            echo "::error file=crates/butler-web/assets/app.css::assets/app.css is stale: run \`just web-css\` (Tailwind CSS v4.2.1) and commit the result"
            exit 1
          fi

  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    needs: zizmor
    # cargo-deny reads the lockfile and never builds, so one Linux runner covers
    # every target listed in deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Split so an advisory filed upstream does not mask a bans or
        # source regression introduced by the change under review.
        check: [advisories, bans sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.check }}
