[package]
authors.workspace      = true
categories.workspace   = true
description            = "Web dashboard for butler: live stats over SSE, charts, and failed-job management"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["background", "dashboard", "jobs", "queue", "web"]
license.workspace      = true
name                   = "butler-web"
readme                 = "README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[[bin]]
name = "butler-web"
path = "src/main.rs"

[dependencies]
anyhow.workspace             = true
askama.workspace             = true
axum.workspace               = true
base64.workspace             = true
butler.workspace             = true
serde.workspace              = true
serde_json.workspace         = true
subtle.workspace             = true
thiserror.workspace          = true
tokio                        = { features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], workspace = true }
tokio-stream                 = { features = ["sync"], workspace = true }
tracing.workspace            = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace          = true
