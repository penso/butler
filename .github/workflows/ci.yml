name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Audits the workflows themselves for injection, over-broad permissions,
  # unpinned actions, and credential persistence.
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  checks:
    name: Format, lint, and test (${{ matrix.runner }})
    needs: zizmor
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # macOS runners have no Docker; there the Redis test skips itself.
      - name: Start Redis for the Redis backend test
        if: runner.os == 'Linux'
        run: docker run -d --name butler-redis -p 6379:6379 redis:8-alpine
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint every feature combination
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features --features tokio -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features --features redis -- -D warnings
          cargo clippy --locked -p butler-jobs --all-targets --no-default-features --features sqlite -- -D warnings
      - name: Test default features
        run: cargo test --locked --workspace
      - name: Test without optional features
        run: cargo test --locked -p butler-jobs --no-default-features

  # The dashboard in a real browser: live chart, SSE reconnect, theme, confirm
  # dialogs, bulk actions and basic auth, against the seeded server in e2e/.
  browser:
    name: Dashboard in a browser (Playwright)
    needs: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: browser
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: e2e
        run: npm test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  toml:
    name: TOML formatting
    needs: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned taplo
        env:
          TAPLO_SHA256: 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/taplo.gz" https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          echo "$TAPLO_SHA256  $RUNNER_TEMP/taplo.gz" | sha256sum --check
          gunzip "$RUNNER_TEMP/taplo.gz"
          chmod +x "$RUNNER_TEMP/taplo"
      - name: Check TOML formatting
        run: '"$RUNNER_TEMP/taplo" fmt --check'

  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    needs: zizmor
    # cargo-deny reads the lockfile and never builds, so one Linux runner covers
    # every target listed in deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Split so an advisory filed upstream does not mask a bans or
        # source regression introduced by the change under review.
        check: [advisories, bans sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.check }}
