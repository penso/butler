[package]
authors.workspace      = true
categories.workspace   = true
description            = "Sidekiq-style background jobs: `.await` a #[job] function to enqueue it, and a worker runs it"
edition.workspace      = true
homepage.workspace     = true
keywords               = ["background", "jobs", "queue", "redis", "sidekiq"]
license.workspace      = true
name                   = "butler-jobs"
readme                 = "../../README.md"
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

# Published as `butler-jobs`, used as `butler`: `use butler::job`.
[lib]
name = "butler"

[features]
default = ["redis", "sqlite", "tokio"]
# Adds the Redis backend (`backend = "redis"` in butler.toml).
redis = ["dep:redis"]
# Adds the SQLite backend (`backend = "sqlite"` in butler.toml), with SQLite bundled.
sqlite = ["dep:rusqlite"]
# Adds `Worker::run_async` and makes enqueueing from inside a tokio runtime non-blocking.
tokio = ["dep:tokio"]

[dependencies]
butler-macros.workspace = true
chrono.workspace        = true
chrono-tz.workspace     = true
config.workspace        = true
cron-parser.workspace   = true
inventory.workspace     = true
redis                   = { optional = true, workspace = true }
rusqlite                = { optional = true, workspace = true }
serde.workspace         = true
serde_json.workspace    = true
thiserror.workspace     = true
tokio                   = { features = ["macros", "rt", "sync", "time"], optional = true, workspace = true }
tracing.workspace       = true

[dev-dependencies]
# Only to show that jobs written with anyhow still work; the library doesn't use it.
anyhow.workspace = true
tokio            = { features = ["macros", "rt-multi-thread", "sync", "time"], workspace = true }
