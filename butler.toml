# Butler settings, read from ./butler.toml by `butler::Config::load()`.
# Environment variables override any key, e.g. BUTLER_QUEUE__BACKEND=file.

[queue]
backend = "redis" # "redis", "sqlite", "file", or "memory" (in-process only)

[queue.file]
dir = ".butler"

[queue.sqlite]
path = "butler.db"

[queue.redis]
prefix = "butler"
url    = "redis://127.0.0.1:6379/"

[worker]
concurrency           = 4
heartbeat_ttl_secs    = 30
max_retries           = 1
poll_interval_ms      = 50
recover_interval_secs = 10
# Before each retry: "exponential" (the default), "polynomial", or "fixed:30s".
backoff = "exponential"
# Jobs with a Progress: the most often their progress is saved.
checkpoint_interval_ms = 1000
# Weighted: "critical" comes first 3 times out of 4. A plain list like
# ["critical", "default"] would be strict priority instead.
queues = [["critical", 3], ["default", 1]]

# Optional caps on jobs running at once, per queue, on top of `concurrency`.
# [worker.queue_limits]
# mailers = 20

# Jobs the workers enqueue on a cron schedule, once per tick between them.
# Five fields, as in crontab: minute hour day-of-month month day-of-week.
[[recurring]]
args = ["every minute"]
cron = "* * * * *"
job  = "demo.summary"
# Optional: queue = "..." (default: the job's own), timezone = "Europe/Paris"
# (default: "UTC"), key = "..." (default: derived from the other fields; set
# one to keep a schedule's history when changing them).
