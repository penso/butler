# cargo-deny configuration. Run locally with `just audit-deps` (`cargo deny check`).

[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"
version      = 2
yanked       = "deny"

[licenses]
allow                = ["Apache-2.0", "BSD-3-Clause", "BSL-1.0", "MIT", "Unicode-3.0", "Unlicense", "Zlib"]
confidence-threshold = 0.9
# Workspace crates are unpublished and carry no license yet.
private = { ignore = true }
version = 2

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
