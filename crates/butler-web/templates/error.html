{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
<div class="card mx-auto max-w-xl p-8 text-center">
  <p class="text-4xl font-semibold tabular-nums text-[var(--error)]">{{ status }}</p>
  <p class="mt-3 text-sm text-[var(--muted)] mono">{{ message }}</p>
  <a class="btn mt-6" href="{{ base }}{% if base.is_empty() %}/{% endif %}">Back to the dashboard</a>
</div>
{% endblock %}
